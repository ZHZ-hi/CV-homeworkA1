<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像处理工具 - 颜色空间与插值</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; color: #fff; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center; margin-bottom: 30px; font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 25px; margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .panel h2 { margin-bottom: 20px; color: #00d4ff; font-size: 1.3rem; }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px; padding: 40px; text-align: center;
            cursor: pointer; transition: all 0.3s;
        }
        .upload-area:hover { border-color: #00d4ff; background: rgba(0, 212, 255, 0.1); }
        .upload-area input { display: none; }
        .preview-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .preview-box {
            flex: 1; min-width: 300px; background: rgba(0, 0, 0, 0.3);
            border-radius: 10px; padding: 10px;
        }
        .preview-box img { max-width: 100%; border-radius: 5px; }
        .preview-box p { text-align: center; margin-top: 10px; color: #aaa; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; margin-bottom: 8px; color: #ccc; }
        select, input[type="number"] {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 1rem;
        }
        select:focus, input:focus { outline: none; border-color: #00d4ff; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 1rem; transition: all 0.3s; margin-right: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf); color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1); color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            padding: 10px 20px; border-radius: 8px; cursor: pointer;
            background: rgba(255, 255, 255, 0.1); transition: all 0.3s;
        }
        .tab.active { background: linear-gradient(135deg, #00d4ff, #7b2cbf); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .results {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px; margin-top: 20px;
        }
        .result-item {
            background: rgba(0, 0, 0, 0.3); border-radius: 10px;
            padding: 10px; text-align: center;
        }
        .result-item img { max-width: 100%; border-radius: 5px; }
        .result-item p { margin-top: 8px; font-size: 0.85rem; color: #aaa; }
        .hidden { display: none; }
        .form-row { display: flex; gap: 15px; }
        .form-row > div { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 图像处理工具 (OpenCV.js)</h1>
        
        <div class="panel">
            <h2>📤 上传图像</h2>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p>点击或拖拽图像文件到此处</p>
                <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            </div>
            <div class="preview-container" id="previewContainer">
                <div class="preview-box">
                    <img id="originalPreview" src="" alt="原图">
                    <p>原图</p>
                </div>
                <div class="preview-box" id="resultBox" style="display: none;">
                    <img id="resultPreview" src="" alt="结果">
                    <p>处理结果</p>
                </div>
            </div>
        </div>
        
        <div class="panel">
            <h2>⚙️ 选择功能</h2>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('colorSpace')">颜色空间转换</div>
                <div class="tab" onclick="switchTab('interpolation')">图像插值</div>
            </div>
            
            <div id="colorSpace" class="tab-content active">
                <div class="control-group">
                    <label>选择颜色空间：</label>
                    <select id="colorSpaceSelect">
                        <option value="RGB">RGB</option>
                        <option value="HSV">HSV</option>
                        <option value="HLS">HLS</option>
                        <option value="YUV">YUV</option>
                        <option value="YCrCb">YCrCb</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="processColorSpace()">转换并显示所有通道</button>
                <div class="results" id="colorSpaceResults"></div>
            </div>
            
            <div id="interpolation" class="tab-content">
                <div class="control-group">
                    <label>选择操作：</label>
                    <select id="interpOperation" onchange="toggleOperationParams()">
                        <option value="scale">放大/缩小</option>
                        <option value="resize">缩放到指定尺寸</option>
                        <option value="rotate">旋转</option>
                    </select>
                </div>
                
                <div class="control-group" id="scaleParams">
                    <label>缩放倍数：</label>
                    <input type="number" id="scaleFactor" value="2" min="0.1" max="10" step="0.1">
                </div>
                
                <div class="control-group hidden" id="resizeParams">
                    <div class="form-row">
                        <div>
                            <label>宽度：</label>
                            <input type="number" id="resizeWidth" value="400" min="1" max="5000">
                        </div>
                        <div>
                            <label>高度：</label>
                            <input type="number" id="resizeHeight" value="300" min="1" max="5000">
                        </div>
                    </div>
                </div>
                
                <div class="control-group hidden" id="rotateParams">
                    <label>旋转角度（度）：</label>
                    <input type="number" id="rotateAngle" value="45" min="-360" max="360">
                </div>
                
                <div class="control-group">
                    <label>插值方法：</label>
                    <select id="interpMethod">
                        <option value="bilinear">双线性插值</option>
                        <option value="nearest">最近邻插值</option>
                    </select>
                </div>
                
                <button class="btn btn-primary" onclick="processInterpolation()">执行插值</button>
                <button class="btn btn-secondary" onclick="downloadResult()">下载结果</button>
            </div>
        </div>
    </div>

    <script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <script>
        let cvReady = false;
        let currentImageData = null;
        let currentResultData = null;

        cv['onRuntimeInitialized'] = () => {
            cvReady = true;
            console.log('OpenCV.js 已加载');
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function toggleOperationParams() {
            const op = document.getElementById('interpOperation').value;
            document.getElementById('scaleParams').classList.add('hidden');
            document.getElementById('resizeParams').classList.add('hidden');
            document.getElementById('rotateParams').classList.add('hidden');
            
            if (op === 'scale') document.getElementById('scaleParams').classList.remove('hidden');
            else if (op === 'resize') document.getElementById('resizeParams').classList.remove('hidden');
            else if (op === 'rotate') document.getElementById('rotateParams').classList.remove('hidden');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        currentImageData = ctx.getImageData(0, 0, img.width, img.height);
                        document.getElementById('originalPreview').src = canvas.toDataURL();
                        document.getElementById('resultBox').style.display = 'none';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function matToDataURL(mat) {
            const canvas = document.createElement('canvas');
            canvas.width = mat.cols;
            canvas.height = mat.rows;
            const ctx = canvas.getContext('2d');
            const imgData = new ImageData(new Uint8ClampedArray(mat.data), mat.cols, mat.rows);
            ctx.putImageData(imgData, 0, 0);
            return canvas.toDataURL();
        }

        function imageDataToMat(imageData) {
            const mat = new cv.Mat(imageData.height, imageData.width, cv.CV_8UC4);
            mat.data.set(imageData.data);
            return mat;
        }

        function processColorSpace() {
            if (!currentImageData) {
                alert('请先上传图像');
                return;
            }
            
            if (!cvReady) {
                alert('OpenCV正在加载，请稍候...');
                return;
            }

            const colorSpace = document.getElementById('colorSpaceSelect').value;
            const src = imageDataToMat(currentImageData);
            const results = [];
            
            if (colorSpace === 'RGB') {
                const channels = cv.split(src);
                const zeros = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC1);
                
                results.push({name: 'R通道', img: channels[2]});
                results.push({name: 'G通道', img: channels[1]});
                results.push({name: 'B通道', img: channels[0]});
                results.push({name: 'R通道(彩色)', img: cv.merge([zeros, zeros, channels[2]])});
                results.push({name: 'G通道(彩色)', img: cv.merge([zeros, channels[1], zeros])});
                results.push({name: 'B通道(彩色)', img: cv.merge([channels[0], zeros, zeros])});
                
                zeros.delete();
                channels.forEach(c => c.delete());
            } 
            else if (colorSpace === 'HSV') {
                const hsv = new cv.Mat();
                cv.cvtColor(src, hsv, cv.COLOR_RGB2HSV);
                const channels = cv.split(hsv);
                
                results.push({name: 'H通道', img: channels[0]});
                results.push({name: 'S通道', img: channels[1]});
                results.push({name: 'V通道', img: channels[2]});
                results.push({name: 'H通道(彩色)', img: cv.merge([channels[0], channels[0], channels[0]])});
                results.push({name: 'S通道(彩色)', img: cv.merge([channels[1], channels[1], channels[1]])});
                results.push({name: 'V通道(彩色)', img: cv.merge([channels[2], channels[2], channels[2]])});
                
                channels.forEach(c => c.delete());
                hsv.delete();
            }
            else if (colorSpace === 'HLS') {
                const hls = new cv.Mat();
                cv.cvtColor(src, hls, cv.COLOR_RGB2HLS);
                const channels = cv.split(hls);
                
                results.push({name: 'H通道', img: channels[0]});
                results.push({name: 'L通道', img: channels[1]});
                results.push({name: 'S通道', img: channels[2]});
                results.push({name: 'H通道(彩色)', img: cv.merge([channels[0], channels[0], channels[0]])});
                results.push({name: 'L通道(彩色)', img: cv.merge([channels[1], channels[1], channels[1]])});
                results.push({name: 'S通道(彩色)', img: cv.merge([channels[2], channels[2], channels[2]])});
                
                channels.forEach(c => c.delete());
                hls.delete();
            }
            else if (colorSpace === 'YUV') {
                const yuv = new cv.Mat();
                cv.cvtColor(src, yuv, cv.COLOR_RGB2YUV);
                const channels = cv.split(yuv);
                
                results.push({name: 'Y通道', img: channels[0]});
                results.push({name: 'U通道', img: channels[1]});
                results.push({name: 'V通道', img: channels[2]});
                results.push({name: 'Y通道(彩色)', img: cv.merge([channels[0], channels[0], channels[0]])});
                results.push({name: 'U通道(彩色)', img: cv.merge([channels[1], channels[1], channels[1]])});
                results.push({name: 'V通道(彩色)', img: cv.merge([channels[2], channels[2], channels[2]])});
                
                channels.forEach(c => c.delete());
                yuv.delete();
            }
            else if (colorSpace === 'YCrCb') {
                const ycrcb = new cv.Mat();
                cv.cvtColor(src, ycrcb, cv.COLOR_RGB2YCrCb);
                const channels = cv.split(ycrcb);
                
                results.push({name: 'Y通道', img: channels[0]});
                results.push({name: 'Cr通道', img: channels[1]});
                results.push({name: 'Cb通道', img: channels[2]});
                results.push({name: 'Y通道(彩色)', img: cv.merge([channels[0], channels[0], channels[0]])});
                results.push({name: 'Cr通道(彩色)', img: cv.merge([channels[1], channels[1], channels[1]])});
                results.push({name: 'Cb通道(彩色)', img: cv.merge([channels[2], channels[2], channels[2]])});
                
                channels.forEach(c => c.delete());
                ycrcb.delete();
            }
            
            const container = document.getElementById('colorSpaceResults');
            container.innerHTML = '';
            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <img src="${matToDataURL(item.img)}" alt="${item.name}">
                    <p>${item.name}</p>
                `;
                container.appendChild(div);
                item.img.delete();
            });
            
            src.delete();
        }

        function processInterpolation() {
            if (!currentImageData) {
                alert('请先上传图像');
                return;
            }
            
            if (!cvReady) {
                alert('OpenCV正在加载，请稍候...');
                return;
            }

            const operation = document.getElementById('interpOperation').value;
            const method = document.getElementById('interpMethod').value;
            const src = imageDataToMat(currentImageData);
            let dst = new cv.Mat();
            
            const interp = method === 'nearest' ? cv.INTER_NEAREST : cv.INTER_LINEAR;
            
            if (operation === 'scale') {
                const scale = parseFloat(document.getElementById('scaleFactor').value);
                const newW = Math.round(src.cols * scale);
                const newH = Math.round(src.rows * scale);
                cv.resize(src, dst, new cv.Size(newW, newH), 0, 0, interp);
            }
            else if (operation === 'resize') {
                const width = parseInt(document.getElementById('resizeWidth').value);
                const height = parseInt(document.getElementById('resizeHeight').value);
                cv.resize(src, dst, new cv.Size(width, height), 0, 0, interp);
            }
            else if (operation === 'rotate') {
                const angle = parseFloat(document.getElementById('rotateAngle').value);
                const center = new cv.Point(src.cols / 2, src.rows / 2);
                const rotMat = cv.getRotationMatrix2D(center, angle, 1);
                
                const cos = Math.abs(rotMat.data64f[0]);
                const sin = Math.abs(rotMat.data64f[1]);
                const newW = Math.round(src.cols * cos + src.rows * sin);
                const newH = Math.round(src.cols * sin + src.rows * cos);
                rotMat.data64f[2] += (newW - src.cols) / 2;
                rotMat.data64f[5] += (newH - src.rows) / 2;
                
                cv.warpAffine(src, dst, rotMat, new cv.Size(newW, newH), interp, cv.BORDER_CONSTANT, new cv.Scalar(0, 0, 0, 0));
                rotMat.delete();
            }
            
            currentResultData = dst;
            document.getElementById('resultPreview').src = matToDataURL(dst);
            document.getElementById('resultBox').style.display = 'block';
            
            src.delete();
        }

        function downloadResult() {
            if (!currentResultData) {
                alert('没有可下载的结果');
                return;
            }
            const link = document.createElement('a');
            link.href = matToDataURL(currentResultData);
            link.download = 'result.png';
            link.click();
        }
    </script>
</body>
</html>
